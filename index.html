<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>廊下安全歩行チェッカー (複数人対応版)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f0f2f5; text-align: center; }
        #container { position: relative; margin: 20px auto; width: 640px; height: 480px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); border-radius: 8px; overflow: hidden; }
        video, canvas { position: absolute; top: 0; left: 0; width: 640px; height: 480px; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(255, 0, 0, 0.6); display: flex; justify-content: center; align-items: center; color: white; font-size: 48px; font-weight: bold; opacity: 0; transition: opacity 0.1s; pointer-events: none; z-index: 10; }
        #status-box { margin: 20px auto; width: 640px; padding: 15px; background: white; border-radius: 8px; font-size: 18px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); height: 100px; overflow-y: auto; text-align: left; }
        .param-control { margin: 10px; }
    </style>
</head>
<body>

    <h1>🏃‍♂️ 廊下安全歩行チェッカー (複数人同時検知) 🚶‍♂️</h1>
    <div class="param-control">
        <label for="threshold-input">⏱ 危険判定秒数：</label>
        <input type="number" id="threshold-input" value="1.2" step="0.1" min="0.5" style="width: 60px;"> 秒
    </div>

    <div id="container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
        <div id="overlay">⚠️ スピード違反！🏃‍♂️💨</div>
    </div>

    <div id="status-box">
        <div id="info">AI起動中...</div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const info = document.getElementById('info');
        const thresholdInput = document.getElementById('threshold-input');

        let detector;
        let startX, endX;
        
        // 追跡中のユーザーたちを記憶する配列
        let trackedUsers = []; 
        let nextUserId = 1;

        function playAlertSound() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            setTimeout(() => { oscillator.stop(); }, 400);
        }

        function logResult(message, isWarning) {
            const color = isWarning ? 'red' : 'green';
            const weight = isWarning ? 'bold' : 'normal';
            const newLog = `<div style="color:${color}; font-weight:${weight};">${message}</div>`;
            info.innerHTML = newLog + info.innerHTML; // 最新のログを上に
        }

        async function setupApp() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false });
            video.srcObject = stream;
            await new Promise((resolve) => { video.onloadedmetadata = () => resolve(video); });
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            startX = canvas.width * 0.3;
            endX = canvas.width * 0.7;

            // マルチポーズ(MULTIPOSE)モデルでデテクタを作成
            detector = await poseDetection.createDetector(
                poseDetection.SupportedModels.MoveNet,
                { modelType: poseDetection.movenet.modelType.MULTIPOSE_LIGHTNING }
            );

            info.innerText = "🟢 マルチスキャン作動中！全員を監視しています...";
            detectPose();
        }

        async function detectPose() {
            const poses = await detector.estimatePoses(video);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 境界線の描画
            ctx.strokeStyle = '#007bff'; ctx.lineWidth = 3; ctx.setLineDash([6, 6]);
            ctx.beginPath(); ctx.moveTo(startX, 0); ctx.lineTo(startX, canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(endX, 0); ctx.lineTo(endX, canvas.height); ctx.stroke();

            const now = performance.now();
            const limitSeconds = parseFloat(thresholdInput.value);
            let currentFrameNoses = [];

            // 1. 今回のフレームで見つかった「信頼度の高い鼻」をリストアップ
            poses.forEach(pose => {
                const nose = pose.keypoints.find(kp => kp.name === 'nose');
                if (nose && nose.score > 0.3) {
                    currentFrameNoses.push({ x: nose.x, y: nose.y });
                }
            });

            // 2. 既存の追跡データと、新しい鼻の位置をマッチング（簡易トラッキング）
            let updatedUsers = [];

            currentFrameNoses.forEach(nose => {
                // 一番距離が近い、前フレームのユーザーを探す（30ピクセル以内なら同一人物とみなす）
                let matchedUser = null;
                let minDistance = 50; 

                trackedUsers.forEach(user => {
                    const dist = Math.hypot(user.lastX - nose.x, user.lastY - nose.y);
                    if (dist < minDistance) {
                        minDistance = dist;
                        matchedUser = user;
                    }
                });

                if (matchedUser) {
                    // 同一人物のデータを更新
                    matchedUser.lastX = nose.x;
                    matchedUser.lastY = nose.y;
                    matchedUser.lastTime = now;

                    // ゴール判定 (左から右)
                    if (matchedUser.direction === 'L2R' && nose.x > endX && !matchedUser.isFinished) {
                        const elapsed = (now - matchedUser.startTime) / 1000;
                        matchedUser.isFinished = true;
                        if (elapsed < limitSeconds) {
                            playAlertSound();
                            overlay.style.opacity = '1';
                            setTimeout(() => { overlay.style.opacity = '0'; }, 1000);
                            logResult(`⚠️ 判定[ID:${matchedUser.id}]: 走りました！ (${elapsed.toFixed(2)}秒)`, true);
                        } else {
                            logResult(`🚶‍♂️ 判定[ID:${matchedUser.id}]: 安全歩行です。 (${elapsed.toFixed(2)}秒)`, false);
                        }
                    }
                    // ゴール判定 (右から左)
                    else if (matchedUser.direction === 'R2L' && nose.x < startX && !matchedUser.isFinished) {
                        const elapsed = (now - matchedUser.startTime) / 1000;
                        matchedUser.isFinished = true;
                        if (elapsed < limitSeconds) {
                            playAlertSound();
                            overlay.style.opacity = '1';
                            setTimeout(() => { overlay.style.opacity = '0'; }, 1000);
                            logResult(`⚠️ 判定[ID:${matchedUser.id}]: 走りました！ (${elapsed.toFixed(2)}秒)`, true);
                        } else {
                            logResult(`🚶‍♂️ 判定[ID:${matchedUser.id}]: 安全歩行です。 (${elapsed.toFixed(2)}秒)`, false);
                        }
                    }

                    updatedUsers.push(matchedUser);
                    // マッチしたものはリストから一時除外（重複防止）
                    trackedUsers = trackedUsers.filter(u => u.id !== matchedUser.id);
                } else {
                    // 新しい人が入ってきた場合の処理（スタート線付近のみで新規登録）
                    let direction = null;
                    if (nose.x > startX && nose.x < startX + 50) direction = 'L2R';
                    if (nose.x < endX && nose.x > endX - 50) direction = 'R2L';

                    if (direction) {
                        const newUser = {
                            id: nextUserId++,
                            startTime: now,
                            lastX: nose.x,
                            lastY: nose.y,
                            lastTime: now,
                            direction: direction,
                            isFinished: false
                        };
                        updatedUsers.push(newUser);
                    }
                }

                // 画面にIDとマーカーを描画
                const displayId = matchedUser ? matchedUser.id : (nextUserId - 1);
                ctx.fillStyle = '#ffc107';
                ctx.beginPath(); ctx.arc(nose.x, nose.y, 8, 0, 2 * Math.PI); ctx.fill();
                ctx.fillStyle = '#000'; ctx.font = '14px Arial';
                ctx.fillText(`ID:${displayId}`, nose.x - 15, nose.y - 15);
            });

            // 3. 画面から消えた人（タイムアウト）や、まだ画面内にいる人を整理して次回へ引き継ぐ
            trackedUsers.forEach(user => {
                // 3秒以上動きがない、またはゴール済みの古いデータは破棄
                if (now - user.lastTime < 3000 && !user.isFinished) {
                    updatedUsers.push(user);
                }
            });

            trackedUsers = updatedUsers;
            requestAnimationFrame(detectPose);
        }

        setupApp().catch(err => { console.error(err); info.innerHTML = "<span style='color:red;'>起動エラー</span>"; });
    </script>
</body>
</html>
